[tool.pytest.ini_options]
testpaths = ["tests"]
# The gate lives here rather than in a command line, so a bare `pytest`
# enforces it. Coverage is scoped to `app` because the tests are not the
# product; branch coverage is on because the quote loader's degraded paths are
# the part most worth holding.
addopts = """
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
"""

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]
